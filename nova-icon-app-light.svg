    </mask>

    <radialGradient id="novaCoreLight" gradientUnits="userSpaceOnUse" cx="32" cy="32" r="18.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.09" stop-color="#ddfffb"/>
      <stop offset="0.20" stop-color="#5ff2ea"/>
      <stop offset="0.36" stop-color="#15b2ad"/>
      <stop offset="0.56" stop-color="#1b75e4"/>
      <stop offset="0.78" stop-color="#132a6e"/>
      <stop offset="1" stop-color="#050d26"/>
