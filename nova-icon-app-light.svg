      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#c9fffa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c9fffa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="novaSpikeVLight" gradientUnits="userSpaceOnUse" cx="32" cy="32" r="18.8"
